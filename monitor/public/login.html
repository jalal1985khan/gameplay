<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Aviator Live Monitor</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10141c;color:#e8ecf3;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  form{width:min(360px,calc(100vw - 32px));background:#191e29;border:1px solid #2a3142;border-radius:12px;padding:24px;display:grid;gap:14px}
  h1{font-size:20px;margin:0 0 4px}
  label{display:grid;gap:6px;font-size:14px;color:#aab3c5}
  input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #2a3142;background:#10141c;color:inherit}
  input:focus-visible,button:focus-visible{outline:2px solid #3987e5;outline-offset:2px}
  button{font:inherit;font-weight:600;padding:11px;border:0;border-radius:8px;background:#3987e5;color:#fff;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  #msg{min-height:1.5em;margin:0;font-size:14px;color:#f0a58a}
</style>
</head>
<body>
<form id="f">
  <h1>✈ Aviator Live Monitor</h1>
  <label>Name<input id="name" autocomplete="username" autocapitalize="none" required autofocus></label>
  <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
  <button id="go" type="submit">Sign in</button>
  <p id="msg" role="alert"></p>
</form>
<script>
  const $ = id => document.getElementById(id);
  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    $('go').disabled = true; $('msg').textContent = '';
    let r;
    try {
      r = await (await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name: $('name').value, password: $('password').value})})).json();
    } catch { r = {ok: false, error: 'No answer from the monitor.'}; }
    if (r.ok) { location.href = '/'; return; }
    $('msg').textContent = r.error || 'Could not sign in.';
    $('go').disabled = false; $('password').select();
  });
</script>
</body>
</html>
